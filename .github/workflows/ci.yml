name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: V1 ${{ matrix.v1 }} / V2 ${{ matrix.v2 }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - v1: "1.18.29"
            v2: "2.0.11"
          - v1: "1.18.31"
            v2: "latest"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --ignore-scripts --no-audit --no-fund --no-save "@opencode-ai/plugin@${{ matrix.v1 }}" "@opencode/plugin@${{ matrix.v2 }}"
      - run: npm run typecheck
      - run: npm run typecheck:test
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
