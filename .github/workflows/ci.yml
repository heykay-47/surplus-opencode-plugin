name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fail on production dependency advisories
        run: npm audit --omit=dev
      - name: Check the full dependency tree, including development tools
        run: npm audit --audit-level=low

  verify:
    name: V1 ${{ matrix.v1 }} / V2 ${{ matrix.v2 }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - v1: "1.18.29"
            v2: "2.0.11"
          - v1: "1.18.31"
            v2: "2.0.22"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --ignore-scripts --no-audit --no-fund --no-save "@opencode-ai/plugin@${{ matrix.v1 }}" "@opencode/plugin@${{ matrix.v2 }}"
      - run: npm run typecheck
      - run: npm run typecheck:test
      - run: npm test
      - run: npm run build
      - run: npm run check:package

  windows-acl:
    name: Windows ACL verification
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:test
      - run: npx tsx --test test/atomic.windows.test.ts
